<svg width="920" height="620" viewBox="0 0 920 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="fb-canvas-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0e1520" />
      <stop offset="60%" stop-color="#080c12" />
      <stop offset="100%" stop-color="#05080c" />
    </radialGradient>

    <!-- Turf Grass Ambient Glow -->
    <radialGradient id="fb-turf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Ball Contact Shadow -->
    <radialGradient id="fb-ball-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Leather Cricket Ball Body -->
    <radialGradient id="fb-cricket-ball-body" cx="36%" cy="32%" r="68%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="16%" stop-color="#dc2626" />
      <stop offset="42%" stop-color="#b91c1c" />
      <stop offset="70%" stop-color="#881337" />
      <stop offset="90%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#1f0209" />
    </radialGradient>

    <!-- Specular Arc -->
    <linearGradient id="fb-leather-specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="fb-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="fb-orbit-line-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="fb-orbit-line-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <style>
    .fb-tech-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #f0f6fc;
      letter-spacing: 0.3px;
    }
    .fb-orbit-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #64748b;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Backdrop -->
  <rect width="920" height="620" rx="16" fill="url(#fb-canvas-bg)" />
  <ellipse cx="460" cy="310" rx="340" ry="190" fill="url(#fb-turf-glow)" />
  <ellipse cx="460" cy="405" rx="85" ry="20" fill="url(#fb-ball-shadow)" />

  <!-- Orbit Tracks -->
  <ellipse cx="460" cy="310" rx="415" ry="195" fill="none" stroke="url(#fb-orbit-line-2)" stroke-width="1.2" stroke-dasharray="5 5" />
  <ellipse cx="460" cy="310" rx="310" ry="145" fill="none" stroke="url(#fb-orbit-line-1)" stroke-width="1.2" stroke-dasharray="4 4" />
  <ellipse cx="460" cy="310" rx="205" ry="98" fill="none" stroke="url(#fb-orbit-line-1)" stroke-width="1.2" />

  <text x="460" y="100" text-anchor="middle" class="fb-orbit-label">INFRASTRUCTURE &amp; TOOLS</text>
  <text x="460" y="152" text-anchor="middle" class="fb-orbit-label">BACKEND &amp; DATABASES</text>
  <text x="460" y="198" text-anchor="middle" class="fb-orbit-label">LANGUAGES &amp; FRONTEND</text>

  <!-- Outer Orbit Cards -->
  <g transform="translate(820, 296)">
    <rect width="96" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#2496ed" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#2496ed" />
    <text x="27" y="18" class="fb-tech-text">Docker</text>
  </g>
  <g transform="translate(422, 491)">
    <rect width="76" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#f05032" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#f05032" />
    <text x="27" y="18" class="fb-tech-text">Git</text>
  </g>
  <g transform="translate(10, 296)">
    <rect width="92" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#e2e8f0" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#f0f6fc" />
    <text x="27" y="18" class="fb-tech-text">GitHub</text>
  </g>
  <g transform="translate(398, 101)">
    <rect width="124" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#06b6d4" />
    <text x="27" y="18" class="fb-tech-text">Tailwind CSS</text>
  </g>

  <!-- Middle Orbit Cards -->
  <g transform="translate(712, 332)">
    <rect width="94" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#5fa04e" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#5fa04e" />
    <text x="27" y="18" class="fb-tech-text">Node.js</text>
  </g>
  <g transform="translate(407, 439)">
    <rect width="106" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#94a3b8" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#cbd5e1" />
    <text x="27" y="18" class="fb-tech-text">Express.js</text>
  </g>
  <g transform="translate(122, 344)">
    <rect width="112" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#336791" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#336791" />
    <text x="27" y="18" class="fb-tech-text">PostgreSQL</text>
  </g>
  <g transform="translate(225, 180)">
    <rect width="98" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#47a248" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#47a248" />
    <text x="27" y="18" class="fb-tech-text">MongoDB</text>
  </g>
  <g transform="translate(585, 178)">
    <rect width="88" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#c084fc" />
    <text x="27" y="18" class="fb-tech-text">Prisma</text>
  </g>

  <!-- Inner Orbit Cards -->
  <g transform="translate(620, 296)">
    <rect width="76" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#00599c" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#00599c" />
    <text x="27" y="18" class="fb-tech-text">C++</text>
  </g>
  <g transform="translate(404, 393)">
    <rect width="112" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#3178c6" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#3178c6" />
    <text x="27" y="18" class="fb-tech-text">TypeScript</text>
  </g>
  <g transform="translate(208, 296)">
    <rect width="110" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#f7df1e" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#f7df1e" />
    <text x="27" y="18" class="fb-tech-text">JavaScript</text>
  </g>
  <g transform="translate(416, 198)">
    <rect width="88" height="28" rx="14" fill="url(#fb-card-bg)" stroke="#61dafb" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#61dafb" />
    <text x="27" y="18" class="fb-tech-text">React</text>
  </g>

  <!-- Central Cricket Ball -->
  <g transform="translate(460, 310)">
    <circle cx="0" cy="0" r="76" fill="url(#fb-cricket-ball-body)" />
    <ellipse cx="-26" cy="-28" rx="34" ry="18" transform="rotate(-30 -26 -28)" fill="url(#fb-leather-specular)" />
    <path d="M -73,-14 C -20,-2 20,-2 73,-14" stroke="#4c0519" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" fill="none" />
    <g transform="rotate(-15) translate(-42, 28)">
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="6.5" font-weight="700" fill="#fbbf24" letter-spacing="1.5" opacity="0.85">SW • TEST 156g</text>
      <text x="10" y="8" font-family="ui-monospace, monospace" font-size="5" font-weight="600" fill="#f59e0b" letter-spacing="1" opacity="0.75">SPECIAL SEAM</text>
    </g>

    <!-- Hand-Stitched Raised Seam -->
    <g transform="rotate(20)">
      <path d="M 0,-76 C 22,-38 22,38 0,76" stroke="#3b0712" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7" />
      <path d="M 0,-76 C 20,-38 20,38 0,76" stroke="#991b1b" stroke-width="6" stroke-linecap="round" fill="none" />
      <path d="M 0,-76 C 20,-38 20,38 0,76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95" />

      <!-- Alternating Stitches -->
      <line x1="-3" y1="-70" x2="3" y2="-68" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="3" y1="-67" x2="-3" y2="-65" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="-1" y1="-62" x2="6" y2="-59" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="6" y1="-58" x2="-1" y2="-55" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="2" y1="-51" x2="10" y2="-47" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="10" y1="-46" x2="2" y2="-42" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="5" y1="-37" x2="14" y2="-32" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="14" y1="-31" x2="5" y2="-26" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="7" y1="-21" x2="17" y2="-15" stroke="#ffffff" stroke-width="1.3" opacity="0.95" />
      <line x1="17" y1="-14" x2="7" y2="-8" stroke="#ffffff" stroke-width="1.3" opacity="0.95" />
      <line x1="9" y1="-3" x2="19" y2="3" stroke="#ffffff" stroke-width="1.4" opacity="0.98" />
      <line x1="19" y1="4" x2="9" y2="10" stroke="#ffffff" stroke-width="1.4" opacity="0.98" />
      <line x1="8" y1="15" x2="18" y2="21" stroke="#ffffff" stroke-width="1.3" opacity="0.95" />
      <line x1="18" y1="22" x2="8" y2="28" stroke="#ffffff" stroke-width="1.3" opacity="0.95" />
      <line x1="6" y1="33" x2="15" y2="38" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="15" y1="39" x2="6" y2="44" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="3" y1="49" x2="11" y2="53" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="11" y1="54" x2="3" y2="58" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="0" y1="63" x2="7" y2="66" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
      <line x1="7" y1="67" x2="0" y2="70" stroke="#ffffff" stroke-width="1.3" opacity="0.9" />
    </g>
    <circle cx="0" cy="0" r="75.5" stroke="#1f0209" stroke-width="1" fill="none" opacity="0.9" />
  </g>
</svg>
