<svg width="860" height="240" viewBox="0 0 860 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#080c10" />
    </linearGradient>

    <!-- Border Gradient with subtle pitch-green accent -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <!-- Hairline Divider Gradient -->
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Red/Leather Seam Accent for the Monogram -->
    <linearGradient id="monogram-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .tag { font-size: 11px; fill: #8b949e; letter-spacing: 2px; font-weight: 600; }
    .name { font-size: 38px; fill: #f0f6fc; font-weight: 700; letter-spacing: -0.5px; }
    .sub { font-size: 15px; fill: #94a3b8; font-weight: 400; }
    .term-prompt { font-size: 13px; fill: #64748b; }
    .term-user { font-size: 13px; fill: #8b949e; }
    .term-cmd { font-size: 13px; fill: #e2e8f0; font-weight: 500; }
    .term-cursor { fill: #10b981; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="858" height="238" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Top Right Monogram Badge -->
  <g transform="translate(784, 28)">
    <rect width="44" height="34" rx="8" fill="#161b22" stroke="url(#monogram-border)" stroke-width="1.2" />
    <text x="22" y="22" class="mono" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">SW</text>
  </g>

  <!-- Header Details -->
  <!-- Tag -->
  <g transform="translate(42, 48)">
    <rect x="0" y="2" width="6" height="6" rx="1" fill="#10b981" />
    <text x="16" y="9" class="mono tag">SOFTWARE DEVELOPER</text>
  </g>

  <!-- Big Name -->
  <text x="42" y="98" class="sans name">Shantanu Walia</text>

  <!-- Subtitle -->
  <text x="42" y="132" class="sans sub">Software Developer  |  Full-Stack Developer  |  DSA</text>

  <!-- Hairline Divider -->
  <line x1="42" y1="162" x2="818" y2="162" stroke="url(#divider-grad)" stroke-width="1" />

  <!-- Terminal Command Prompt at Bottom -->
  <g transform="translate(42, 196)">
    <text x="0" y="0" class="mono term-user">shantanu@dev</text>
    <text x="100" y="0" class="mono term-prompt">~ $</text>
    <text x="130" y="0" class="mono term-cmd">g++ -std=c++20 -O3 main.cpp &amp;&amp; ./solution</text>
    <!-- Cricket ball accent mark in terminal -->
    <circle cx="496" cy="-4" r="3" fill="#b91c1c" />
    <rect x="506" y="-12" width="7" height="15" rx="1" class="term-cursor" />
  </g>
</svg>
