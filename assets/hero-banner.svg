<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Shantanu Walia — Full Stack Developer</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#010101"/><stop offset=".28" stop-color="#060a0c"/>
  <stop offset=".5" stop-color="#112228"/><stop offset=".75" stop-color="#265968"/><stop offset="1" stop-color="#44a0b8"/>
</linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer></filter>
<clipPath id="tc"><rect class="tclip" x="64" y="200" width="0" height="28"/></clipPath>
<clipPath id="card"><rect x="1" y="1" width="998" height="278" rx="24"/></clipPath>
</defs>
<style>
.fade{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rule{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:draw 1.3s cubic-bezier(.6,.1,.2,1) 1.2s forwards}
@keyframes draw{to{transform:scaleX(1)}}
.shine{opacity:0;animation:sh 5s ease-in-out 3s infinite}
@keyframes sh{0%{transform:translateX(0);opacity:0}15%{opacity:1}70%{transform:translateX(732px);opacity:0}100%{transform:translateX(732px);opacity:0}}
.tclip{animation:ty 2.10s steps(35,end) 2.3s forwards}
@keyframes ty{to{width:294.0px}}
.tcur{opacity:0;animation:tc 2.10s steps(35,end) 2.3s forwards}
@keyframes tc{0%{opacity:1;transform:translateX(0)}99%{opacity:1}100%{opacity:1;transform:translateX(294.0px)}}
.tblink{animation:bl 1.2s ease-in-out 4.50s infinite}
@keyframes bl{0%,45%{opacity:1}60%,100%{opacity:0}}
.dot{animation:pl 2.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.3}}
</style>
<g clip-path="url(#card)">
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="#808080" filter="url(#grain)"/>
</g>
<rect x="1" y="1" width="998" height="278" rx="24" fill="none" stroke="#fff" stroke-opacity=".1"/>

<!-- monogram (frosted) -->
<g class="fade" style="animation-delay:.2s">
  <rect x="890" y="34" width="66" height="66" rx="18" fill="#a9c9d1" fill-opacity=".75"/>
  <text x="923" y="75" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="1" fill="#0b1a1f" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">SW</text>
</g>

<g class="fade" style="animation-delay:.3s">
  <rect class="dot" x="64" y="56" width="6" height="6" rx="1" fill="#8fb3bd"/>
  <text x="80" y="63" font-size="12" letter-spacing="4.4" fill="#8fb3bd" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">FULL STACK DEVELOPER</text>
</g>

<g class="fade" style="animation-delay:.6s">
  <text x="61" y="133" font-size="66" font-weight="800" letter-spacing="-2.5" fill="#fafcfc" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Shantanu Walia</text>
</g>

<g class="fade" style="animation-delay:1s">
  <text x="64" y="168" font-size="17" fill="#aebfc4" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Building clean, reliable web applications.</text>
</g>

<rect class="rule" x="64" y="190" width="872" height="1" fill="url(#rule)"/>
<rect class="shine" x="64" y="189.5" width="140" height="2" fill="url(#shine)"/>

<g clip-path="url(#tc)">
  <text x="64" y="220" font-size="14" textLength="294.0" lengthAdjust="spacing" style="white-space:pre" font-family="'SF Mono','JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace"><tspan fill="#cfe6ec" fill-opacity=".6">shantanu@dev ~ </tspan><tspan fill="#e6f4f7">$ </tspan><tspan fill="#ffffff" font-weight="600">build --with=focus</tspan></text>
</g>
<g class="tcur"><g transform="translate(64,0)"><rect class="tblink" x="0" y="204" width="2" height="19" rx="1" fill="#fff"/></g></g>
</svg>
