# ==============================================================================
# GitHub Action: Generate Contribution Grid Snake Animation
# Profile: Shantanu Walia (shantanu-walia)
# ==============================================================================
name: Generate Contribution Snake

on:
  # Daily automated run at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # Manual execution trigger from GitHub Actions UI
  workflow_dispatch:

  # Trigger on push to main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate Contribution Snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generates animated snake SVGs based on shantanu-walia's real contribution graph
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: shantanu-walia
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#10b981
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Automatically deploys the generated SVGs to the `output` branch
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
